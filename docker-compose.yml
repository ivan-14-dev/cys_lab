      - FLASK_DEBUG=0
      - LAB_MODE=secure
      - MONGO_URI=mongodb://mongodb:27017/lab_nosql

  # ─────────────────────────────────────────
  # OPENLDAP (internal only)
  # ─────────────────────────────────────────
  openldap:
    image: osixia/openldap:1.5.0
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - lab-network
    expose:
      - "389"
    environment:
      - LDAP_ORGANISATION=InjectionLab
      - LDAP_DOMAIN=lab.local
      - LDAP_ADMIN_PASSWORD=lab_admin_pass_123
    volumes:
      - ldap-data:/var/lib/ldap
      - ./shared/sample-data/ldap-seed.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/seed.ldif:ro
    command: --copy-service

  # ─────────────────────────────────────────
  # LDAP INJECTION LAB
  # ─────────────────────────────────────────
  ldap-vulnerable:
    <<: [*security-defaults, *resource-limits]
    build:
      context: ./labs/ldap-injection/vulnerable
