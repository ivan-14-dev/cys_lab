    depends_on:
      - openldap
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=0
      - LAB_MODE=vulnerable
      - LAB_FLAG=FLAG{ldap_filter_bypass_all}
      - LDAP_HOST=openldap
      - LDAP_PORT=389
      - LDAP_BASE_DN=dc=lab,dc=local
      - LDAP_ADMIN_PASSWORD=lab_admin_pass_123

  ldap-secure:
