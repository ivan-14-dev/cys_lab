---
# Injection Security Lab — Docker Compose
# ⚠️ EDUCATIONAL USE ONLY — DO NOT EXPOSE TO INTERNET

networks:
  # Internal-only: container-to-container traffic (no internet, no host-initiated connections)
  lab-network:
    internal: true
    driver: bridge
  # Host-access: allows port publishing to localhost (non-internal bridge)
  # Containers on this network cannot reach the internet (no default gateway routing externally)
  host-access:
    internal: false
    driver: bridge

volumes:
  mongodb-data:
  ldap-data:

x-security-defaults: &security-defaults
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

x-resource-limits: &resource-limits
  mem_limit: "256m"
  cpus: "0.5"

services:

  # ─────────────────────────────────────────
  # DASHBOARD
  # ─────────────────────────────────────────
  dashboard:
    <<: [*security-defaults, *resource-limits]
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - lab-network
      - host-access
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=0
    tmpfs:
      - /tmp
    read_only: true

  # ─────────────────────────────────────────
  # XSS LAB
  # ─────────────────────────────────────────
  xss-vulnerable:
    <<: [*security-defaults, *resource-limits]
    build:
      context: ./labs/xss/vulnerable
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5001:5000"
    networks:
      - lab-network
      - host-access
    tmpfs:
      - /tmp
    read_only: true
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=0
      - LAB_MODE=vulnerable
      - LAB_FLAG=FLAG{xss_stored_camera_hijack}

  xss-secure:
    <<: [*security-defaults, *resource-limits]
    build:
      context: ./labs/xss/secure
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5002:5000"
    networks:
      - lab-network
      - host-access
    tmpfs:
      - /tmp
    read_only: true
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=0
      - LAB_MODE=secure

  # ─────────────────────────────────────────
  # COMMAND INJECTION LAB
  # ─────────────────────────────────────────
  cmd-vulnerable:
    <<: [*security-defaults, *resource-limits]
    build:
      context: ./labs/command-injection/vulnerable
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5003:5000"
    networks:
      - lab-network
      - host-access
    tmpfs:
      - /tmp
      - /app/data
    read_only: true
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=0
      - LAB_MODE=vulnerable
      - LAB_FLAG=FLAG{cmd_rce_system_recon}

  cmd-secure:
    <<: [*security-defaults, *resource-limits]
    build:
      context: ./labs/command-injection/secure
      dockerfile: Dockerfile
