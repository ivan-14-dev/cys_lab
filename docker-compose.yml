  # ─────────────────────────────────────────
  # MONGODB (internal only)
  # ─────────────────────────────────────────
  mongodb:
    image: mongo:7.0-jammy
    <<: [*resource-limits]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - lab-network
    volumes:
      - mongodb-data:/data/db
      - ./shared/sample-data/nosql-seed.js:/docker-entrypoint-initdb.d/seed.js:ro
    environment:
      - MONGO_INITDB_DATABASE=lab_nosql
    expose:
      - "27017"
    # No external port — internal network only

  # ─────────────────────────────────────────
  # NOSQL INJECTION LAB
  # ─────────────────────────────────────────
  nosql-vulnerable:
    <<: [*security-defaults, *resource-limits]
    build:
      context: ./labs/nosql-injection/vulnerable
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5007:5000"
    networks:
      - lab-network
      - host-access
    tmpfs:
      - /tmp
    read_only: true
    depends_on:
      - mongodb
    environment:
      - FLASK_ENV=development
      - FLASK_DEBUG=0
      - LAB_MODE=vulnerable
      - LAB_FLAG=FLAG{nosql_regex_blind_extract}
      - MONGO_URI=mongodb://mongodb:27017/lab_nosql

  nosql-secure:
